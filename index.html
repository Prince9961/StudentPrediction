
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eff6ff;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            font-size: 25px;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            color: #15803d;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        #error {
            margin-top: 15px;
            color: #dc2626;
            text-align: center;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Student Performance</h1>
        <p>Predict your expected exam marks</p>

        <form id="predictionForm">

            <label for="hours">Study Hours Per Day</label>
            <input
                type="number"
                id="hours"
                min="0"
                max="24"
                step="0.5"
                placeholder="Enter study hours"
                required
            >

            <label for="attendance">Attendance (%)</label>
            <input
                type="number"
                id="attendance"
                min="0"
                max="100"
                step="0.1"
                placeholder="Enter attendance percentage"
                required
            >

            <label for="marks">Previous Marks (out of 100)</label>
            <input
                type="number"
                id="marks"
                min="0"
                max="100"
                step="0.1"
                placeholder="Enter previous marks"
                required
            >

            <button type="submit" id="predictButton">
                Predict Marks
            </button>

        </form>

        <div id="result" aria-live="polite"></div>
        <div id="error" aria-live="polite"></div>

    </div>

    <script>
        const form = document.getElementById("predictionForm");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const hours = Number(
                document.getElementById("hours").value
            );

            const attendance = Number(
                document.getElementById("attendance").value
            );

            const marks = Number(
                document.getElementById("marks").value
            );

            const result = document.getElementById("result");
            const error = document.getElementById("error");
            const button = document.getElementById("predictButton");

            result.textContent = "";
            error.textContent = "";

            button.disabled = true;
            button.textContent = "Predicting...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:5000/predict",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            study_hours: hours,
                            attendance: attendance,
                            previous_marks: marks
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Prediction failed"
                    );
                }

                result.textContent =
                    "Predicted Marks: " +
                    Number(data.predicted_marks).toFixed(2) +
                    " / 100";

            } catch (err) {
                console.error("Prediction error:", err);

                error.textContent =
                    "Unable to get prediction. " + err.message +
                    ". Check that your Flask server is running.";

            } finally {
                button.disabled = false;
                button.textContent = "Predict Marks";
            }
        });
    </script>

</body>
</html>
